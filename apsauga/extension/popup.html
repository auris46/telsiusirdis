<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>Apsauga</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <div class="p-head"><img src="icons/icon48.png" alt=""><b>Apsauga</b></div>

  <div class="site" id="site">
    <div class="muted" id="siteLbl"></div>
    <div class="host" id="siteHost">—</div>
    <div class="v" id="siteVerdict"></div>
    <ul id="siteReasons"></ul>
  </div>
  <button class="btn ghost" id="blockBtn" hidden></button>

  <label class="sw"><input type="checkbox" id="enabled"><span id="lblEnabled"></span></label>
  <label class="sw"><input type="checkbox" id="strict"><span id="lblStrict"></span></label>
  <label class="sw"><input type="checkbox" id="feed"><span><span id="lblFeed"></span><br><span class="muted" id="feedInfo"></span></span></label>
  <button class="btn ghost small" id="feedUpdate" style="margin-top:6px"></button>
  <label class="sw"><input type="checkbox" id="rdap"><span id="lblRdap"></span></label>

  <details>
    <summary id="lblCheck"></summary>
    <textarea id="text"></textarea>
    <div id="textRes"></div>
  </details>

  <details>
    <summary id="lblTrusted"></summary>
    <ul class="list" id="trusted"></ul>
  </details>
  <details>
    <summary id="lblBlocked"></summary>
    <ul class="list" id="blocked"></ul>
  </details>

  <script src="shared/i18n.js"></script>
  <script src="shared/detector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
