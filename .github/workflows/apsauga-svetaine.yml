# Paruošia svetainę Hostinger (ar kitam talpinimui) atskiroje šakoje „svetaine“.
# Hostinger: Websites → Advanced → Git → šaka „svetaine“, auto-deploy įjungtas.
# Kiekvienas pakeitimas main šakoje → testai → nauja svetainės versija → Hostinger ją paskelbia pats.
# Jei testai nepavyksta, svetainė neatnaujinama.
name: Apsauga – svetainė Hostinger

on:
  push:
    branches: [main, master]
    paths: ['apsauga/**', '.github/workflows/apsauga-svetaine.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apsauga-svetaine
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atpažinimo variklio testai
        run: node --test apsauga/tests/detector.test.js
      - name: Surinkti svetainę
        run: sh apsauga/tools/build-site.sh _site
      - name: Paskelbti į šaką „svetaine“
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b svetaine
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Svetainė iš ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" svetaine
